const tend=(a,b)=>a>b?1:a<b?-1:0
const calcPts=(pred,match)=>{
  if(match.s1===null)return null
  if(!pred||pred.s1===null||pred.s2===null)return 0
  if(pred.s1===match.s1&&pred.s2===match.s2)return 3
  if(tend(pred.s1,pred.s2)===tend(match.s1,match.s2))return 1
  return 0
}

function buildBoard(pp,mm,rr){
  return pp.map(p=>{
    let tot=0,ex=0,lv=0,fail=0,jug=0
    for(const m of mm){
      const p2=calcPts((rr[p.id]||{})[m.id],m)
      if(p2===null)continue
      jug++;tot+=p2
      if(p2===3)ex++;else if(p2===1)lv++;else fail++
    }
    const done=Object.values(rr[p.id]||{}).filter(x=>x&&x.s1!==null&&x.s2!==null).length
    const pct=jug>0?((tot/(jug*3))*100).toFixed(2)+'%':'-'
    return{...p,tot,ex,lv,fail,jug,done,pct}
  }).sort((a,b)=>b.tot-a.tot)
}
function simulateChances(pp,mm,rr){
  const rem=mm.filter(m=>m.s1===null).length*3
  const board=buildBoard(pp,mm,rr)
  if(!board.length)return[]
  const top=board[0].tot
  return board.map(p=>({...p,maxPossible:p.tot+rem,canWin:p.tot+rem>=top}))
}

x solid #e0e4ea',display:'flex',alignItems:'center',gap:12}}><div style={{flex:1,background:'#f4f5f7',borderRadius:4,height:6}}><div style={{background:filled===72?'#2ecc71':'#f0c030',width:`${(filled/72)*100}%`,height:'100%',borderRadius:4,transition:'width 0.3s'}}/></div><span style={{fontSize:13,color:filled===72?'#2ecc71':'#f0c030',fontWeight:700,whiteSpace:'nowrap'}}>{filled}/72</span></div><div style={{display:'flex',gap:4,overflowX:'auto',paddingBottom:8,marginBottom:10}}>{grps.map(g=><button key={g} onClick={()=>setGrp(g)} style={pill(grp===g)}>G{g}{grpFilled(g)===6?' ✓':''}</button>)}</div><div style={{display:'flex',flexDirection:'column',gap:6,marginBottom:16}}>{MATCHES.filter(m=>m.g===grp).map(m=>{const p=preds[m.id]||{};const done=p.s1!==undefined&&p.s1!==''&&p.s2!==undefined&&p.s2!=='';return(<div key={m.id} style={{background:'#ffffff',border:`1px solid ${done?'#27ae60':'#2a2a3a'}`,borderRadius:10,padding:'10px 12px'}}><div style={{display:'flex',alignItems:'center',gap:8}}><span style={{flex:1,textAlign:'right',fontSize:13,color:'#222',fontWeight:500}}>{m.t1}</span><input type="number" value={p.s1??''} min="0" max="20" onChange={e=>upd(m.id,'s1',e.target.value)} style={si}/><span style={{color:'#aaa',fontWeight:700}}>-</span><input type="number" value={p.s2??''} min="0" max="20" onChange={e=>upd(m.id,'s2',e.target.value)} style={si}/><span style={{flex:1,fontSize:13,color:'#222',fontWeight:500}}>{m.t2}</span></div></div>)})}</div><div style={{display:'flex',gap:8,marginBottom:8}}>{grp>'A'&&<button onClick={()=>setGrp(String.fromCharCode(grp.charCodeAt(0)-1))} style={{flex:1,padding:10,background:'#ffffff',border:'1px solid #e0e4ea',borderRadius:10,color:'#888',cursor:'pointer',fontSize:14}}>← G{String.fromCharCode(grp.charCodeAt(0)-1)}</button>}{grp<'L'&&<button onClick={()=>setGrp(String.fromCharCode(grp.charCodeAt(0)+1))} style={{flex:1,padding:10,background:'#f4f5f7',border:'none',borderRadius:10,color:'#1a1a2e',cursor:'pointer',fontSize:14,fontWeight:700}}>G{String.fromCharCode(grp.charCodeAt(0)+1)} →</button>}</div></div><div style={{position:'fixed',bottom:0,left:'50%',transform:'translateX(-50%)',width:'100%',maxWidth:480,background:'#ffffff',borderTop:'1px solid #dde3ec',padding:'10px 14px'}}><button onClick={()=>{if(!name.trim()){alert('Ingresá tu nombre primero');return};setStep('code')}} disabled={filled===0} style={{width:'100%',padding:'13px',background:name.trim()&&filled>0?'#25D366':'#ccc',border:'none',borderRadius:12,color:'white',fontWeight:800,fontSize:16,cursor:name.trim()&&filled>0?'pointer':'not-allowed'}}>{filled===72?'✅ Generar código (72/72)':`📲 Generar código (${filled}/72)`}</button></div></div>)
}

// ── ADMIN ─────────────────────────────────────────────────
function Admin(){
  const [tab,setTab]=useState('tabla')

  const [mm,setMM]=useState(()=>{const stored=LS.get('wc26m',null);if(!stored||stored.length!==MATCHES.length||stored[0]?.id!==MATCHES[0].id)return MATCHES;return stored.map((s,i)=>({...MATCHES[i],s1:s.s1,s2:s.s2}))})
  const [rr,setRR]=useState(()=>LS.get('wc26r',{}))
  const [loading,setLoading]=useState(true)

  const grps=Object.keys(GRP)

  const showToast=(msg,color='#27ae60')=>{setToast({msg,color});setTimeout(()=>setToast(null),2500)}

  // Código PRODE26 de un jugador (mismo formato posicional que genera la vista Jugador)
  const genCodeFor=p=>`PRODE26|${p.name}|${MATCHES.map(m=>{const pr=(rr[p.id]||{})[m.id];return(pr&&pr.s1!==null&&pr.s1!==undefined&&pr.s2!==null&&pr.s2!==undefined)?`${pr.s1}-${pr.s2}`:'?'}).join(',')}`
  const waShareFor=p=>`https://wa.me/?text=${encodeURIComponent('⚽ *PRODE MUNDIAL 2026*\n👤 *'+p.name+'*\n\n📋 Tu código actual. Pegalo en la web (Importar), editá lo que quieras y mandame el código nuevo:\n\n'+genCodeFor(p))}`

  // Detecta jugadores con el mismo set de pronósticos (mismo código importado 2 veces)
  const detectDupes=()=>{
    const sigs={}
    pp.forEach(p=>{
      const preds=rr[p.id]||{}
      const done=Object.values(preds).filter(x=>x&&x.s1!==null&&x.s2!==null).length
      if(done===0)return // sin pronósticos no hay nada que comparar
      const sig=MATCHES.map(m=>{const pr=preds[m.id];return(pr&&pr.s1!==null&&pr.s1!==undefined&&pr.s2!==null&&pr.s2!==undefined)?`${pr.s1}-${pr.s2}`:'?'}).join(',')
      if(!sigs[sig])sigs[sig]=[]
      sigs[sig].push({name:p.name,done})
    })
    setDupResult(Object.values(sigs).filter(g=>g.length>1))
  }

  const svP=p=>{setPP(p);LS.set('wc26p',p)}
  const svM=m=>{setMM(m);LS.set('wc26m',m);setSimResult(null)}
  const svR=r=>{setRR(r);LS.set('wc26r',r)}
  const svAll=(p,m,r)=>{setPP(p);setMM(m);setRR(r);LS.set('wc26p',p);LS.set('wc26m',m);LS.set('wc26r',r)}
  // ID único aunque se creen dos jugadores en el mismo milisegundo (evita que cargar uno pise al otro)
  const newPlayerId=()=>'p'+Date.now()+'-'+Math.random().toString(36).slice(2,8)

  const dbSavePlayers=ps=>sb.from('jugadores').upsert(ps.map((p,i)=>({id:p.id,nombre:p.name,orden:i}))).then(({error})=>{if(error)console.error('dbSavePlayers:',error)})
  const dbSavePlayer=(p,orden)=>sb.from('jugadores').upsert({id:p.id,nombre:p.name,orden}).then(({error})=>{if(error)console.error('dbSavePlayer:',error)})
  const dbDeletePlayer=id=>{sb.from('jugadores').delete().eq('id',id).then();sb.from('pronosticos').delete().eq('jugador_id',id).then()}
  const dbSaveResult=async m=>{
    if(m.s1!==null&&m.s2!==null){
      const {error}=await sb.from('partidos').update({goles1:m.s1,goles2:m.s2}).eq('id',m.id)
      if(error)console.error('dbSaveResult:',error)
    }else{
      const {error}=await sb.from('partidos').update({goles1:null,goles2:null}).eq('id',m.id)
      if(error)console.error('dbClearResult:',error)
    }
  }
  const dbSavePred=(jugId,midId)=>{const pred=(rrRef.current[jugId]||{})[midId];if(pred&&pred.s1!==null&&pred.s2!==null){sb.from('pronosticos').upsert({jugador_id:jugId,partido_id:midId,goles1:pred.s1,goles2:pred.s2},{onConflict:'jugador_id,partido_id'}).then()}}
  const dbSavePlayerPreds=async(jugId,preds)=>{const rows=Object.entries(preds).filter(([,p])=>p&&p.s1!==null&&p.s2!==null).map(([mid,p])=>({jugador_id:jugId,partido_id:mid,goles1:p.s1,goles2:p.s2}));if(!rows.length)return;await sb.from('pronosticos').upsert(rows,{onConflict:'jugador_id,partido_id'})}
  const seedPartidos=async()=>{const rows=MATCHES.map(m=>({id:m.id,grupo:m.g,equipo1:m.t1,equipo2:m.t2,goles1:null,goles2:null,fecha:m.date,hora:m.time}));await sb.from('partidos').upsert(rows)}
  // Trae TODOS los pronósticos paginando: Supabase corta en 1000 filas por request (con 15+ jugadores ya se supera)
  const fetchAllPronos=async()=>{let all=[],from=0;const size=1000;for(;;){const {data,error}=await sb.from('pronosticos').select('*').order('jugador_id').order('partido_id').range(from,from+size-1);if(error||!data||!data.length)break;all=all.concat(data);if(data.length<size)break;from+=size}return all}

  // Debounced result save — fix para que no se borre al refrescar
  const debounceSaveResult=(matchId,newMM)=>{
    const cur=(newMM||mmRef.current).find(x=>x.id===matchId)
    if(!cur)return
    // Si los dos goles están completos, guardar inmediatamente
    if(cur.s1!==null&&cur.s2!==null){
      clearTimeout(saveTimer.current[matchId])
      saveTimer.current[matchId]=true // bloquear refresh
      dbSaveResult(cur).then(()=>{
        saveTimer.current[matchId]=null
        showToast('✓ Guardado')
      })
    }
  }

  useEffect(()=>{
    const init=async()=>{
      try{
        const [{data:jData},{data:pData},{data:prData}]=await Promise.all([sb.from('jugadores').select('*').order('orden'),sb.from('partidos').select('id,goles1,goles2'),fetchAllPronos().then(data=>({data}))])
        if(jData?.length>0){const loaded=jData.map(j=>({id:j.id,name:j.nombre,orden:j.orden}));setPP(loaded);LS.set('wc26p',loaded)}
        if(!pData||pData.length===0){await seedPartidos()}
        else{const newMM=MATCHES.map(m=>{const db=pData.find(p=>p.id===m.id);return{...m,s1:db?.goles1??null,s2:db?.goles2??null}});setMM(newMM);LS.set('wc26m',newMM)}
        if(prData?.length>0){const loaded={};prData.forEach(p=>{if(!loaded[p.jugador_id])loaded[p.jugador_id]={};loaded[p.jugador_id][p.partido_id]={s1:p.goles1,s2:p.goles2}});setRR(loaded);LS.set('wc26r',loaded)}
        setSyncMsg('✓ Sincronizado')
      }catch(e){console.error('Init error:',e);setSyncMsg('⚠ Sin conexión')}
      setLoading(false)
    }
    init()
  },[])

  useEffect(()=>{
    const interval=setInterval(async()=>{
      try{
        const [{data:pData},{data:jData},{data:prData}]=await Promise.all([sb.from('partidos').select('id,goles1,goles2'),sb.from('jugadores').select('*').order('orden'),fetchAllPronos().then(data=>({data}))])
        // Sincronizar jugadores y pronósticos cargados desde otro dispositivo
        if(jData?.length){const loaded=jData.map(j=>({id:j.id,name:j.nombre,orden:j.orden}));setPP(loaded);LS.set('wc26p',loaded)}
        if(prData){
          const loaded={};prData.forEach(p=>{if(!loaded[p.jugador_id])loaded[p.jugador_id]={};loaded[p.jugador_id][p.partido_id]={s1:p.goles1,s2:p.goles2}})
          setRR(prev=>{
            // Conservar pronósticos locales a medio tipear (un solo gol cargado)
            Object.entries(prev).forEach(([jug,preds])=>{Object.entries(preds||{}).forEach(([mid,p])=>{if(p&&(p.s1===null)!==(p.s2===null)){if(!loaded[jug])loaded[jug]={};loaded[jug][mid]=p}})})
            LS.set('wc26r',loaded)
            return loaded
          })
        }
        if(pData){
          setMM(prev=>{
            const updated=prev.map(m=>{
              const db=pData.find(p=>p.id===m.id)
              if(!db)return m
              const ns1=db.goles1??null,ns2=db.goles2??null
              // No sobreescribir si hay un guardado pendiente
              if(saveTimer.current[m.id])return m
              return(ns1!==m.s1||ns2!==m.s2)?{...m,s1:ns1,s2:ns2}:m
            })
            LS.set('wc26m',updated)
            return updated
          })
          setSyncMsg('✓ '+new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}))
        }
      }catch(e){setSyncMsg('⚠ Sin conexión')}
    },30000)
    return()=>clearInterval(interval)
  },[])

  const doImport=async()=>{
    setImportLog(null)
    const line=importTxt.trim().split('\n').map(l=>l.trim()).find(l=>l.startsWith('PRODE26|'))

              <span style={{flex:1,fontSize:12,color:'#222',fontWeight:500}}>{m.t2}</span>

      <div style={{position:'fixed',bottom:0,left:'50%',transform:'translateX(-50%)',width:'100%',maxWidth:430,background:'#ffffff',borderTop:'1px solid #dde3ec',display:'flex',zIndex:100}}>

const ARN_PLAYER={id:'arnaldo',name:'🤖 Arnaldo',orden:999}
function AdminOffline({withArnaldo}){
  const [pp,setPP]=useState(()=>LS.get('wc26off_p',[]))
  const [mm,setMM]=useState(()=>{
    const stored=LS.get('wc26off_m',null)
    if(!stored||stored.length!==MATCHES.length)return MATCHES
    return MATCHES.map((m,i)=>({...m,s1:stored[i]?.s1??null,s2:stored[i]?.s2??null}))
  })
  const [rr,setRR]=useState(()=>LS.get('wc26off_r',{}))
  const [ts,setTs]=useState(()=>LS.get('wc26off_ts',null))
  const [tab,setTab]=useState('oficial')
  const [dayFilter,setDayFilter]=useState('')
  const [anaMatchId,setAnaMatchId]=useState(()=>LS.get('wc26off_anaM',null))

  const [importTxt,setImportTxt]=useState('')

  const PP=withArnaldo?[...pp,ARN_PLAYER]:pp
  const RR=withArnaldo?{...rr,arnaldo:ARNALDO_PREDS}:rr
  const board=buildBoard(PP,mm,RR)
  const played=mm.filter(m=>m.s1!==null).length
  const noData=!pp.length

  // Baja TODO de Supabase (jugadores + partidos + pronósticos) y persiste local.
  // Después de la primera vez ya no necesita internet — los resultados se cargan offline.
  const fetchFromSupabase=async()=>{
    setLoading(true);setFetchErr(null)
    try{
      const fetchAllPronos=async()=>{let all=[],from=0;const size=1000;for(;;){const {data,error}=await sb.from('pronosticos').select('*').order('jugador_id').order('partido_id').range(from,from+size-1);if(error||!data||!data.length)break;all=all.concat(data);if(data.length<size)break;from+=size}return all}
      const [{data:jData,error:jErr},{data:pData,error:pErr},prData]=await Promise.all([
        sb.from('jugadores').select('*').order('orden'),
        sb.from('partidos').select('id,goles1,goles2'),
        fetchAllPronos()
      ])
      if(jErr)throw new Error(jErr.message)
      if(pErr)throw new Error(pErr.message)
      if(!jData?.length)throw new Error('Sin jugadores en Supabase')
      const newPP=jData.map(j=>({id:j.id,name:j.nombre,orden:j.orden}))
      const newMM=MATCHES.map(m=>{const db=pData?.find(p=>p.id===m.id);return{...m,s1:db?.goles1??null,s2:db?.goles2??null}})
      const newRR={}
      ;(prData||[]).forEach(p=>{if(!newRR[p.jugador_id])newRR[p.jugador_id]={};newRR[p.jugador_id][p.partido_id]={s1:p.goles1,s2:p.goles2}})
      const now=new Date().toISOString()
      setPP(newPP);LS.set('wc26off_p',newPP)
      setMM(newMM);LS.set('wc26off_m',newMM)
      setRR(newRR);LS.set('wc26off_r',newRR)
      setTs(now);LS.set('wc26off_ts',now)
      showToast(`✓ ${newPP.length} jugadores, ${prData.length} pronósticos`)
    }catch(e){setFetchErr(e.message||'Error de conexión');showToast('Error: '+(e.message||'sin conexión'),'#e74c3c')}
    setLoading(false)
  }

  // Si no hay datos cacheados al abrir, baja automáticamente de Supabase.
  useEffect(()=>{if(noData&&!loading&&!fetchErr)fetchFromSupabase()},[])

  // Auto-actualización de resultados desde Supabase (al abrir y cada 60s). Solo agrega
  // resultados que YA existen en Supabase; nunca borra los que tengas cargados a mano.
  const syncResults=async()=>{try{const {data}=await sb.from('partidos').select('id,goles1,goles2');if(!data)return;setMM(prev=>{const nm=prev.map(m=>{const db=data.find(p=>p.id===m.id);return db&&db.goles1!=null?{...m,s1:db.goles1,s2:db.goles2}:m});LS.set('wc26off_m',nm);return nm})}catch(e){}}
  useEffect(()=>{syncResults();const t=setInterval(syncResults,60000);return()=>clearInterval(t)},[])

  const importFromJSON=()=>{
    try{
      const data=JSON.parse(importTxt.trim())
      if(!Array.isArray(data.jugadores)||!Array.isArray(data.partidos)||typeof data.pronosticos!=='object')throw new Error('bad')
      const newPP=data.jugadores
      const newMM=MATCHES.map(m=>{const d=data.partidos.find(p=>p.id===m.id);return{...m,s1:d?.s1??null,s2:d?.s2??null}})
      const newRR=data.pronosticos
      const now=new Date().toISOString()
      setPP(newPP);LS.set('wc26off_p',newPP)
      setMM(newMM);LS.set('wc26off_m',newMM)
      setRR(newRR);LS.set('wc26off_r',newRR)
      setTs(now);LS.set('wc26off_ts',now)
      setImportTxt('')
      showToast(`✓ ${newPP.length} jugadores cargados`)
    }catch(e){showToast('JSON inválido','#e74c3c')}
  }

  const exportJSON=()=>{
    const data={exportedAt:new Date().toISOString(),jugadores:pp,partidos:mm.map(m=>({id:m.id,s1:m.s1,s2:m.s2})),pronosticos:rr}
    const json=JSON.stringify(data)
    if(navigator.clipboard?.writeText){navigator.clipboard.writeText(json).then(()=>showToast('✓ JSON copiado'))}
    else{prompt('Copiá este JSON:',json)}
  }

  const updateResult=(mid,f,v)=>{
    const newV=v===''?null:Math.max(0,Math.min(20,parseInt(v)||0))
    const newMM=mm.map(m=>m.id===mid?{...m,[f]:newV}:m)
    setMM(newMM);LS.set('wc26off_m',newMM)
  }

  const clearAll=()=>{
    if(!confirm('¿Borrar TODOS los datos offline? Esta acción no se puede deshacer.'))return
    localStorage.removeItem('wc26off_p');localStorage.removeItem('wc26off_m')
    localStorage.removeItem('wc26off_r');localStorage.removeItem('wc26off_ts')
    setPP([]);setMM(MATCHES);setRR({});setTs(null);setTab('tabla')
    showToast('✓ Datos borrados')
  }

  const days=[...new Set(MATCHES.map(m=>m.date))].sort()
  const matchesByDay=days.map(d=>({date:d,matches:mm.filter(m=>m.date===d).sort((a,b)=>a.time.localeCompare(b.time))}))
  const si={width:42,textAlign:'center',background:'#fff8e8',border:'1px solid #d4b890',borderRadius:6,color:'#1a1a2e',fontSize:16,fontWeight:700,padding:'4px 2px',outline:'none',WebkitTextFillColor:'#1a1a2e'}
  const fmtTs=t=>t?new Date(t).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—'

  return(
    <div style={{minHeight:'100vh',background:'#f0f2f5',color:'#1a1a2e',maxWidth:430,margin:'0 auto',paddingBottom:72}}>
      <div style={{background:'linear-gradient(135deg,#1a6b8a,#0d4a5e)',padding:'12px 16px 10px',textAlign:'center',position:'sticky',top:0,zIndex:50}}>
        <div style={{fontSize:16,fontWeight:800,color:'#f0c030',letterSpacing:1}}>⚽ PRODE 2026 — OFFLINE</div>
        <div style={{fontSize:10,color:'#ddd',marginTop:1}}>{noData?'Sin datos · Importá para empezar':`${PP.length} jugadores · ${played}/72 · ${fmtTs(ts)}`}</div>
      </div>

      {toast&&<div style={{position:'fixed',top:80,left:'50%',transform:'translateX(-50%)',background:toast.color,color:'white',padding:'8px 16px',borderRadius:8,fontSize:13,fontWeight:600,zIndex:200,boxShadow:'0 2px 8px rgba(0,0,0,0.2)'}}>{toast.msg}</div>}

      {noData?(
        <div style={{padding:'40px 20px',textAlign:'center'}}>
          {loading?(
            <div>
              <div style={{fontSize:36,marginBottom:12}}>⏳</div>
              <div style={{fontSize:16,fontWeight:700,color:'#1a6b8a',marginBottom:6}}>Descargando datos…</div>
              <div style={{fontSize:12,color:'#666'}}>Esto solo pasa la primera vez.</div>
            </div>
          ):fetchErr?(
            <div>
              <div style={{fontSize:36,marginBottom:12}}>📡</div>
              <div style={{fontSize:16,fontWeight:700,color:'#c0392b',marginBottom:6}}>No se pudo descargar</div>
              <div style={{fontSize:12,color:'#666',marginBottom:16}}>{fetchErr}</div>
              <button onClick={fetchFromSupabase} style={{padding:'10px 24px',background:'#1a6b8a',border:'none',borderRadius:10,color:'white',fontWeight:700,fontSize:14,cursor:'pointer'}}>🔄 Reintentar</button>
              <div style={{fontSize:11,color:'#999',marginTop:24}}>Conectate al WiFi y reintentá.</div>
            </div>
          ):(
            <div style={{fontSize:13,color:'#666'}}>Iniciando…</div>

        )
      })():tab==='partidos'?(
        <div style={{padding:'12px 12px 0'}}>
          <div style={{display:'flex',gap:4,overflowX:'auto',paddingBottom:8,marginBottom:8}}>
            <button onClick={()=>setDayFilter('')} style={{padding:'4px 10px',borderRadius:20,border:'none',cursor:'pointer',fontSize:11,fontWeight:600,whiteSpace:'nowrap',background:!dayFilter?'#1a6b8a':'#ebebeb',color:!dayFilter?'white':'#555'}}>Todos</button>

                    <span style={{color:'#aaa',fontWeight:700}}>-</span>

      ):tab==='analisis'?(()=>{

        const jug=mm.filter(m=>m.s1!==null).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time))
        const defaultMatch=noJug[0]||jug[0]||mm[0]

        const grupos={}
        for(const p of PP){

        const ordenados=Object.entries(grupos).sort((a,b)=>b[1].length-a[1].length||a[0].localeCompare(b[0]))
        const sinPron=PP.filter(p=>{const pr=(RR[p.id]||{})[match.id];return !pr||pr.s1==null||pr.s2==null})
        const resultadoReal=match.s1!==null?`${match.s1}-${match.s2}`:null
        const tendReal=resultadoReal?(match.s1>match.s2?'H':match.s1<match.s2?'A':'D'):null
        const tendOf=m=>{const[a,b]=m.split('-').map(Number);return a>b?'H':a<b?'A':'D'}
        const fmtH=match.date?fmtDate(match.date):''
        // Reporte cm-based para captura: mismo ancho 5.55cm que la tabla oficial
        const cm=n=>`min(${(n*0.9*100/6).toFixed(2)}vw, ${(n*0.9*430/6).toFixed(2)}px)`

              </div>
            </div>
            {(()=>{const opts=anaSoloNoJug?noJug:mm;if(!opts.length)return(<div style={{padding:'10px 8px',fontSize:12,color:'#888',textAlign:'center'}}>No hay partidos sin jugar</div>);return(

              {ordenados.length===0?(

                const esExacto=resultadoReal===marcador
                const esTend=!esExacto&&tendReal&&tendOf(marcador)===tendReal
                const bg=esExacto?'#d5f5e3':esTend?'#fdebd0':(i%2===0?'#ffffff':'#f7f7f7')

              {sinPron.length>0&&(<div style={{background:'#fff5f5',padding:cm(0.1)+' '+cm(0.16),borderTop:'1px solid #ffc7ce'}}>

              </div>)}
              {/* Footer */}
              <div style={{textAlign:'center',padding:cm(0.06),fontSize:cm(0.13),color:'#888',borderTop:'1px solid #ddd'}}>PRODE MUNDIAL 2026 · {new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'})}</div>
            </div>
          </div>
        </div>)
      })():tab==='hoy'?(()=>{
        const HOY=hoyARG()

        if(!dayMatches.length)return(<div style={{padding:'50px 20px',textAlign:'center',color:'#666'}}><div style={{fontSize:42,marginBottom:10}}>📅</div><div style={{fontSize:14,fontWeight:700,marginBottom:4}}>Sin partidos hoy</div><div style={{fontSize:12,color:'#999'}}>{fmtDate(HOY)}</div></div>)

        // Alturas fijas: title 0.4 + (date+ctry) 0.9 + result 0.4 + footer 0.3 = 2.0cm → quedan 7cm para filas

        return(

              <div style={{background:'#3d0070',color:'white',textAlign:'center',padding:cm(0.1),fontSize:cm(0.22),fontWeight:900,letterSpacing:cm(0.08),flexShrink:0}}>R E S U L T A D O S</div>
              <table style={{width:'100%',borderCollapse:'collapse',flex:1,tableLayout:'fixed'}}>
                <thead>
                  <tr>
                    <th rowSpan={2} style={{background:'#f0e8ff',color:'#3d0070',fontSize:cm(0.2),fontWeight:900,padding:cm(0.04),width:sideW}}>{fmtDate(HOY).toUpperCase()}</th>
                    {dayMatches.map(m=>(<th key={m.id+'h'} style={{...cellTH,background:'#7c3aed',width:matchW,padding:cm(0.04)}}>{abbr(m.t1)}</th>))}
                  </tr>
                  <tr>
                    {dayMatches.map(m=>(<th key={m.id+'a'} style={{...cellTH,background:'#6d28d9',padding:cm(0.04)}}>{abbr(m.t2)}</th>))}
                  </tr>
                  <tr>
                    <th style={{background:'#ddd0f5',color:'#3d0070',fontSize:cm(0.16),fontWeight:900,textAlign:'left',paddingLeft:cm(0.1),padding:cm(0.06)+' '+cm(0.1)}}>RESULTADO</th>
                    {dayMatches.map(m=>(<th key={m.id+'r'} style={{background:'#ddd0f5',color:'#3d0070',fontSize:cm(0.21),fontWeight:900,textAlign:'center',padding:cm(0.06)+' 0'}}>{m.s1!==null&&m.s2!==null?`${m.s1}-${m.s2}`:'-'}</th>))}
                  </tr>
                </thead>
                <tbody>
                  {PP.map((jug,ji)=>{
                    const bg=ji%2===0?'#ebebeb':'#ffffff'
                    const nombre=(jug.name||'').toUpperCase()

                    return(
                      <tr key={jug.id} style={{background:bg,height:rowH}}>
                        <td style={{...cellTD,textAlign:'left',color:'#1a1a1a',fontWeight:600,paddingLeft:cm(0.08),whiteSpace:'nowrap'}}>{String(ji+1).padStart(2,'0')} {disp}</td>
                        {dayMatches.map(m=>{
                          const pred=(RR[jug.id]||{})[m.id]
                          const txt=pred&&pred.s1!==null&&pred.s1!==undefined&&pred.s2!==null&&pred.s2!==undefined?`${pred.s1}-${pred.s2}`:'-'
                          return(<td key={m.id} style={cellTD}>{txt}</td>)
                        })}
                      </tr>
                    )
                  })}
                </tbody>
              </table>
              <div style={{textAlign:'center',padding:cm(0.06),fontSize:cm(0.13),color:'#888',borderTop:'1px solid #ddd',flexShrink:0}}>PRODE MUNDIAL 2026 · {new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'})}</div>
            </div>
          </div>
        )
      })():tab==='datos'?(
        <div style={{padding:'14px'}}>
          <div style={{background:'#ffffff',borderRadius:12,padding:14,marginBottom:10,border:'1px solid #e0e4ea'}}>

            <div style={{fontSize:11,color:'#666',marginBottom:8}}>Baja los pronósticos actualizados. Necesita conexión. Los resultados que cargaste offline se conservan.</div>
            <button onClick={async()=>{
              const prevMM=mm
              await fetchFromSupabase()
              // Mantener los resultados que ya tenías cargados offline (Supabase puede tenerlos vacíos)
              const merged=mm.map(m=>{const prev=prevMM.find(x=>x.id===m.id);return prev&&prev.s1!==null&&m.s1===null?{...m,s1:prev.s1,s2:prev.s2}:m})
              setMM(merged);LS.set('wc26off_m',merged)
            }} disabled={loading} style={{width:'100%',padding:10,background:loading?'#999':'#1a6b8a',border:'none',borderRadius:8,color:'white',fontWeight:700,fontSize:13,cursor:loading?'wait':'pointer'}}>{loading?'Descargando…':'Refrescar pronósticos'}</button>
          </div>
          <div style={{background:'#ffffff',borderRadius:12,padding:14,marginBottom:10,border:'1px solid #e0e4ea'}}>
            <div style={{fontSize:13,fontWeight:700,marginBottom:6}}>📤 Exportar JSON</div>
            <div style={{fontSize:11,color:'#666',marginBottom:8}}>Copia el estado actual al portapapeles (backup).</div>
            <button onClick={exportJSON} style={{width:'100%',padding:10,background:'#6a0dad',border:'none',borderRadius:8,color:'white',fontWeight:700,fontSize:13,cursor:'pointer'}}>Copiar JSON</button>
          </div>
          <div style={{background:'#ffffff',borderRadius:12,padding:14,marginBottom:10,border:'1px solid #e0e4ea'}}>
            <div style={{fontSize:13,fontWeight:700,marginBottom:6}}>📥 Importar JSON</div>
            <textarea value={importTxt} onChange={e=>setImportTxt(e.target.value)} placeholder='Pegá un JSON exportado' style={{width:'100%',height:60,padding:8,borderRadius:8,border:'1px solid #e0e4ea',background:'#f8f9fa',color:'#1a1a2e',fontSize:11,fontFamily:'monospace',outline:'none',resize:'none',marginBottom:6}}/>
            <button onClick={importFromJSON} disabled={!importTxt.trim()} style={{width:'100%',padding:10,background:importTxt.trim()?'#6a0dad':'#ccc',border:'none',borderRadius:8,color:'white',fontWeight:700,fontSize:13,cursor:importTxt.trim()?'pointer':'not-allowed'}}>Importar</button>
          </div>
          <div style={{background:'#fff5f5',borderRadius:12,padding:14,border:'1px solid #ffc7ce'}}>
            <div style={{fontSize:13,fontWeight:700,marginBottom:6,color:'#c0392b'}}>🗑 Borrar datos offline</div>
            <button onClick={clearAll} style={{width:'100%',padding:10,background:'#c0392b',border:'none',borderRadius:8,color:'white',fontWeight:700,fontSize:13,cursor:'pointer'}}>Borrar todo</button>
          </div>
        </div>
      ):null}

      {!noData&&(
        <div style={{position:'fixed',bottom:0,left:'50%',transform:'translateX(-50%)',width:'100%',maxWidth:430,background:'#ffffff',borderTop:'1px solid #dde3ec',display:'flex',zIndex:100}}>
          {[['oficial','🏆','Oficial'],['nooficial','📊','No Of.'],['hoy','📅','Hoy'],['analisis','🔍','Análisis'],['partidos','⚽','Partidos'],['datos','⚙️','Datos']].map(([id,ic,la])=>(
            <button key={id} onClick={()=>setTab(id)} style={{flex:1,padding:'8px 1px 6px',background:'transparent',border:'none',cursor:'pointer',color:tab===id?'#1a6b8a':'#aaa',display:'flex',flexDirection:'column',alignItems:'center',gap:1,fontSize:10,fontWeight:tab===id?700:400}}><span style={{fontSize:18}}>{ic}</span>{la}</button>
          ))}
        </div>
      )}
    </div>
  )
}

function App(){
  const [hash,setHash]=useState(window.location.hash)
  useEffect(()=>{const h=()=>setHash(window.location.hash);window.addEventListener('hashchange',h);return()=>window.removeEventListener('hashchange',h)},[])
  if(hash==='#admin'){const stored=localStorage.getItem('wc26_pin_ok');if(stored==='yes')return <Admin/>;return <PinGate/>}
  if(hash==='#admin2'){const stored=localStorage.getItem('wc26_pin_ok');if(stored==='yes')return <AdminOffline/>;return <PinGate/>}
  if(hash==='#admin3'){const stored=localStorage.getItem('wc26_pin_ok');if(stored==='yes')return <AdminOffline withArnaldo={true}/>;return <PinGate/>}
  return <Jugador/>
}

function PinGate(){
  const [pin,setPin]=useState('')
  const [err,setErr]=useState(false)
  const check=()=>{if(pin==='2026'){localStorage.setItem('wc26_pin_ok','yes');window.location.reload()}else{setErr(true);setTimeout(()=>setErr(false),1500)}}
  return(<div style={{minHeight:'100vh',background:'#1a1a2e',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:20,padding:20}}><div style={{fontSize:48}}>🔐</div><div style={{fontSize:20,fontWeight:800,color:'#f0c030'}}>Acceso Admin</div><input type="password" value={pin} onChange={e=>setPin(e.target.value)} onKeyDown={e=>e.key==='Enter'&&check()} placeholder="PIN" style={{padding:'12px 20px',fontSize:22,borderRadius:12,border:`2px solid ${err?'#e74c3c':'#6a0dad'}`,background:'#2a2a3e',color:'white',textAlign:'center',outline:'none',width:160,letterSpacing:8}}/>{err&&<div style={{color:'#e74c3c',fontSize:13}}>PIN incorrecto</div>}<button onClick={check} style={{padding:'12px 32px',background:'#6a0dad',border:'none',borderRadius:12,color:'white',fontWeight:800,fontSize:16,cursor:'pointer'}}>Entrar</button></div>)
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>)
</script></body></html>
