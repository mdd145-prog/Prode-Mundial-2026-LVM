<script type="text/babel">
const {useState,useEffect}=React

// ── DATA ──────────────────────────────────────────────────
const GRP={
  A:['México','Sudáfrica','Corea del Sur','Chequia'],
  B:['Canadá','Suiza','Qatar','Bosnia y Herz.'],
  C:['Brasil','Marruecos','Haití','Escocia'],
  D:['EE.UU.','Paraguay','Australia','Turquía'],
  E:['Alemania','Curazao','Costa de Marfil','Ecuador'],
  F:['Países Bajos','Japón','Túnez','Suecia'],
  G:['Bélgica','Egipto','Irán','Nueva Zelanda'],
  H:['España','Cabo Verde','Arabia Saudita','Uruguay'],
  I:['Francia','Senegal','Noruega','Iraq'],
  J:['Argentina','Argelia','Austria','Jordania'],
  K:['Portugal','Colombia','Uzbekistán','R.D. Congo'],
  L:['Inglaterra','Croacia','Ghana','Panamá'],
}
const GRP_START={A:0,B:1,C:2,D:3,E:4,F:5,G:6,H:7,I:8,J:9,K:10,L:11}
const BASE=new Date(2026,5,11)
const addDays=(d,n)=>{const r=new Date(d.getTime()+n*86400000);return r.toISOString().slice(0,10)}
const MATCHES=(()=>{
  let n=1,m=[]
  for(const [g,t] of Object.entries(GRP)){
    const gs=GRP_START[g]
    const dates=[addDays(BASE,gs),addDays(BASE,gs),addDays(BASE,gs+7),addDays(BASE,gs+7),addDays(BASE,gs+13),addDays(BASE,gs+13)]
    for(const [idx,[i,j]] of [[0,[0,1]],[1,[2,3]],[2,[0,2]],[3,[1,3]],[4,[0,3]],[5,[1,2]]])
      m.push({id:`m${n++}`,g,t1:t[i],t2:t[j],s1:null,s2:null,date:dates[idx]})
  }
  return m
})()

const getMatchDate=mid=>{
  const idx=MATCHES.findIndex(m=>m.id===mid)
  if(idx<0)return null
  const g=Math.floor(idx/6),pos=idx%6,gk=Object.keys(GRP)[g]
  return addDays(BASE,GRP_START[gk]+(pos<2?0:pos<4?7:13))
}

// Horarios Argentina por grupo y posición dentro del grupo (índice 0-5)
// Pares: [0,1],[2,3] = J1 | [0,2],[1,3] = J2 | [0,3],[1,2] = J3
const TIMES={
  A:['16:00','23:00','22:00','13:00','22:00','22:00'],
  B:['16:00','22:00','19:00','16:00','22:00','22:00'],
  C:['19:00','22:00','22:00','19:00','22:00','22:00'],
  D:['22:00','01:00','16:00','22:00','22:00','22:00'],
  E:['17:00','01:00','17:00','23:00','22:00','22:00'],
  F:['14:00','01:00','14:00','21:00','22:00','22:00'],
  G:['16:00','22:00','19:00','22:00','22:00','22:00'],
  H:['13:00','19:00','22:00','16:00','22:00','22:00'],
  I:['16:00','19:00','19:00','16:00','22:00','22:00'],
  J:['22:00','01:00','14:00','01:00','23:00','23:00'],
  K:['14:00','23:00','14:00','23:00','20:30','20:30'],
  L:['17:00','20:00','18:00','18:00','20:30','20:30'],
}
const getMatchTime=mid=>{
  const idx=MATCHES.findIndex(m=>m.id===mid)
  if(idx<0)return''
  const g=Math.floor(idx/6),pos=idx%6,gk=Object.keys(GRP)[g]
  return TIMES[gk]?.[pos]||''
}
const tend=(a,b)=>a>b?1:a<b?-1:0
const calcPts=(pred,match)=>{
  if(match.s1===null)return null
  if(!pred||pred.s1===null||pred.s2===null)return 0
  if(pred.s1===match.s1&&pred.s2===match.s2)return 3
  if(tend(pred.s1,pred.s2)===tend(match.s1,match.s2))return 1
  return 0
}
const toNum=v=>v===''?null:Math.max(0,Math.min(20,parseInt(v)||0))
const LS={
  get:(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
}
const fmtDate=iso=>new Date(iso+'T12:00:00').toLocaleDateString('es-AR',{day:'numeric',month:'short'})

function buildBoard(pp,mm,rr){
  return pp.map(p=>{
    let tot=0,ex=0,lv=0,fail=0,jug=0
    for(const m of mm){
      const p2=calcPts((rr[p.id]||{})[m.id],m)
      if(p2===null)continue
      jug++;tot+=p2
      if(p2===3)ex++;else if(p2===1)lv++;else fail++
    }
    const done=Object.values(rr[p.id]||{}).filter(x=>x&&x.s1!==null&&x.s2!==null).length
    const pct=jug>0?((ex/jug)*100).toFixed(2)+'%':'-'
    return{...p,tot,ex,lv,fail,jug,done,pct}
  }).sort((a,b)=>b.tot-a.tot)
}
function simulateChances(pp,mm,rr){
  const rem=mm.filter(m=>m.s1===null).length*3
  const board=buildBoard(pp,mm,rr)
  if(!board.length)return[]
  const top=board[0].tot
  return board.map(p=>({...p,maxPossible:p.tot+rem,canWin:p.tot+rem>=top}))
}

// ── PDF: TABLA OFICIAL / NO OFICIAL ─────────────────────
function exportPDF(board,oficial){

    const bg=i%2===0?'#d9d9d9':'#ffffff'
    const medal=i===0?'🏆 ':i===1?'🥈 ':i===2?'🥉 ':''

    return `<tr style="background:${bg}">
      <td style="padding:5px 8px;text-align:center;font-weight:700;font-size:12px">${i+1}</td>
      <td style="padding:5px 10px;font-weight:700;font-size:13px;${elim?'text-decoration:line-through;color:#999':''}">${medal}${p.name}${elim?' ❌':''}</td>
      <td style="padding:5px 8px;text-align:center;font-weight:900;font-size:15px">${p.tot}</td>
      <td style="padding:5px 8px;text-align:center;font-size:12px">${p.jug}</td>
      <td style="padding:5px 8px;text-align:center;font-size:12px;font-weight:700;color:#1a6b2e">${p.ex}</td>
      <td style="padding:5px 8px;text-align:center;font-size:12px;font-weight:700;color:#1a6b2e">${p.lv}</td>
      <td style="padding:5px 8px;text-align:center;font-size:12px;font-weight:700;color:#1a6b2e">${p.fail}</td>
      <td style="padding:5px 8px;text-align:center;font-size:11px;color:#444">${p.pct}</td>
    </tr>`
  }).join('')
  const html=`<!DOCTYPE html><html><head><meta charset="UTF-8">
  <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,sans-serif;background:white;padding:0}
  .outer{border:2px solid #333;border-radius:4px;overflow:hidden;width:100%;max-width:560px;margin:20px auto}
  .title-row{display:flex;background:${hdrColor}}
  .title-left{flex:1;color:white;font-size:20px;font-weight:900;padding:13px 16px;letter-spacing:1px}
  .title-right{background:${statsColor};color:white;font-size:12px;font-weight:700;padding:13px 14px;display:flex;align-items:center;letter-spacing:1px}
  table{width:100%;border-collapse:collapse}
  th{padding:7px 8px;font-size:11px;font-weight:700;border-right:1px solid #444}
  .ch{background:#1a1a2e;color:white;text-align:center}.chl{background:#1a1a2e;color:white;text-align:left;padding-left:12px}
  .cs{background:${statsColor};color:white;text-align:center}
  td{border-bottom:1px solid #ccc;border-right:1px solid #ccc}
  .foot{text-align:center;padding:7px;font-size:10px;color:#888;border-top:1px solid #ddd}
  @media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head>
  <body><div class="outer">
  <div class="title-row"><div class="title-left">${title}</div><div class="title-right">RESULTADOS</div></div>
  <table>
    <tr><th class="ch" style="width:40px">POS</th><th class="chl">JUGADOR</th><th class="ch" style="width:50px">PTS</th><th class="ch" style="width:46px">JUG</th>
    <th class="cs" style="width:38px">3</th><th class="cs" style="width:38px">1</th><th class="cs" style="width:38px">0</th><th class="cs" style="width:60px">%</th></tr>
    ${rows}
  </table>
  <div class="foot">PRODE MUNDIAL 2026 · ${fecha}</div>
  </div></body></html>`
  const w=window.open('','_blank','width=620,height=800')
  w.document.write(html);w.document.close();setTimeout(()=>{w.focus();w.print()},600)
}

// ── PDF: TODOS LOS PRONÓSTICOS ────────────────────────────
function exportAllPredictions(pp,mm,rr){
  if(!pp.length){alert('No hay jugadores');return}
  const fecha=new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'})
  const grpSections=Object.keys(GRP).map(g=>{
    const gm=mm.filter(m=>m.g===g)
    const pHeaders=pp.map(p=>`<th style="background:#1a1a2e;color:white;padding:2px;font-size:8px;writing-mode:vertical-lr;transform:rotate(180deg);min-width:26px;border:1px solid #555">${p.name.length>9?p.name.slice(0,9)+'…':p.name}</th>`).join('')
    const rows=gm.map(m=>{
      const cells=pp.map(p=>{
        const pred=(rr[p.id]||{})[m.id]
        const txt=(pred&&pred.s1!==null&&pred.s2!==null)?`${pred.s1}-${pred.s2}`:'-'
        return `<td style="text-align:center;font-size:9px;padding:3px 1px;border:1px solid #ddd;font-weight:${txt!=='-'?700:400};color:${txt!=='-'?'#000':'#bbb'}">${txt}</td>`
      }).join('')
      return `<tr style="background:white"><td style="padding:3px 8px;font-size:9px;font-weight:700;border:1px solid #ddd;white-space:nowrap">${m.t1} vs ${m.t2}</td>${cells}</tr>`
    }).join('')
    return `<div style="margin-bottom:14px;break-inside:avoid">
      <div style="background:#6a0dad;color:white;padding:5px 10px;font-size:11px;font-weight:900;letter-spacing:1px">GRUPO ${g}</div>
      <table style="width:100%;border-collapse:collapse"><tr>
        <th style="background:#1a1a2e;color:white;padding:5px 8px;text-align:left;font-size:9px;border:1px solid #555;min-width:140px">PARTIDO</th>${pHeaders}
      </tr>${rows}</table></div>`
  }).join('')
  const html=`<!DOCTYPE html><html><head><meta charset="UTF-8">
  <style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;background:white;padding:12px}
  @media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact;padding:6px}}</style></head><body>
  <div style="background:#6a0dad;color:white;text-align:center;padding:12px;border-radius:4px;margin-bottom:12px">
    <div style="font-size:18px;font-weight:900;letter-spacing:2px">⚽ PRODE MUNDIAL 2026</div>
    <div style="font-size:10px;opacity:0.8;margin-top:3px">Pronósticos completos · Fase de Grupos · ${fecha}</div>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px;padding:8px;background:#f5f5f5;border-radius:4px">
    ${pp.map((p,i)=>`<span style="background:#1a1a2e;color:white;padding:3px 8px;border-radius:10px;font-size:9px;font-weight:700">${i+1}. ${p.name}</span>`).join('')}
  </div>
  ${grpSections}
  <div style="text-align:center;margin-top:10px;font-size:9px;color:#888;border-top:1px solid #eee;padding-top:6px">Exacto = 3pts · Levante = 1pt · Fallado = 0pts</div>
  </body></html>`
  const w=window.open('','_blank','width=900,height=800')
  w.document.write(html);w.document.close();setTimeout(()=>{w.focus();w.print()},700)
}

// ── PDF: TABLA DEL DÍA ────────────────────────────────────
function exportDayPDF(dayMatches,pp,rr,dayLabel){
  if(!dayMatches.length){alert('No hay partidos para esta fecha');return}
  const fecha=new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'})
  // Players as rows, matches as columns (max 4 matches per day)
  const mHeaders=dayMatches.map(m=>`<th style="background:#1a1a2e;color:white;padding:5px 3px;font-size:9px;writing-mode:vertical-lr;transform:rotate(180deg);min-width:46px;border:1px solid #555;line-height:1.2">${m.t1}<br/>vs<br/>${m.t2}</th>`).join('')
  const resRow=`<tr style="background:#f0e6ff">
    <td style="padding:4px 8px;font-weight:900;font-size:11px;color:#6a0dad;border:1px solid #ddd">RESULTADO REAL</td>
    ${dayMatches.map(m=>`<td style="text-align:center;font-weight:900;font-size:13px;color:#6a0dad;padding:4px;border:1px solid #ddd">${m.s1!==null?`${m.s1}-${m.s2}`:''}</td>`).join('')}
  </tr>`
  const pRows=pp.map((p,i)=>{
    const bg=i%2===0?'#f5f5f5':'#ffffff'
    const cells=dayMatches.map(m=>{
      const pred=(rr[p.id]||{})[m.id]
      const txt=(pred&&pred.s1!==null&&pred.s2!==null)?`${pred.s1}-${pred.s2}`:'-'
      const pts=calcPts(pred,m)
      const cellBg=pts===3?'#c6efce':pts===1?'#ffeb9c':pts===0&&m.s1!==null?'#ffc7ce':bg
      return `<td style="text-align:center;font-size:11px;padding:4px;background:${cellBg};font-weight:${txt!=='-'?700:400};border:1px solid #ddd">${txt}</td>`
    }).join('')
    return `<tr style="background:${bg}"><td style="padding:4px 8px;font-weight:700;font-size:11px;border:1px solid #ddd">${i+1}. ${p.name}</td>${cells}</tr>`
  }).join('')
  const html=`<!DOCTYPE html><html><head><meta charset="UTF-8">
  <style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;padding:14px;background:white}
  @media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body>
  <div style="background:#6a0dad;color:white;text-align:center;padding:10px;font-size:17px;font-weight:900;letter-spacing:2px;border-radius:4px 4px 0 0">⚽ RESULTADOS</div>
  <div style="font-size:28px;font-weight:900;color:#6a0dad;padding:8px 4px 6px">${dayLabel}</div>
  <table style="width:100%;border-collapse:collapse">
    <tr>
      <th style="background:#1a1a2e;color:white;padding:6px 8px;text-align:left;font-size:10px;border:1px solid #555;min-width:130px">JUGADOR</th>
      ${mHeaders}
    </tr>
    ${resRow}
    ${pRows}
  </table>
  <div style="text-align:center;margin-top:8px;font-size:9px;color:#666">🟢 Exacto +3 · 🟡 Levante +1 · 🔴 Fallado</div>
  </body></html>`
  const w=window.open('','_blank','width=700,height=700')
  w.document.write(html);w.document.close();setTimeout(()=>{w.focus();w.print()},600)
}

// ── JUGADOR ───────────────────────────────────────────────

      </div>
      <div style={{padding:'12px 12px 0'}}>
        <div style={{background:'#ffffff',borderRadius:12,padding:14,marginBottom:12,border:'1px solid #e0e4ea'}}>
          <div style={{fontSize:13,color:'#888',marginBottom:8}}>👤 Tu nombre</div>
          <input value={name} onChange={e=>saveName(e.target.value)} placeholder="Ej: Lucas García"
            style={{width:'100%',padding:'10px 12px',borderRadius:8,border:'1px solid #e0e4ea',background:'#f4f5f7',color:'#1a1a2e',fontSize:15,outline:'none',WebkitTextFillColor:'#1a1a2e'}}/>
        </div>
        <div style={{background:'#ffffff',borderRadius:10,padding:'10px 14px',marginBottom:12,border:'1px solid #e0e4ea',display:'flex',alignItems:'center',gap:12}}>
          <div style={{flex:1,background:'#e8f0fe',borderRadius:4,height:6}}>

  const [importLog,setImportLog]=useState(null)
  const [dayFilter,setDayFilter]=useState('')
  const [simResult,setSimResult]=useState(null)

  const grps=Object.keys(GRP)
  const played=mm.filter(m=>m.s1!==null).length
  const showToast=(msg,color='#27ae60')=>{setToast({msg,color});setTimeout(()=>setToast(null),2500)}
  const svP=p=>{setPP(p);LS.set('wc26p',p)}
  const svM=m=>{setMM(m);LS.set('wc26m',m)}
  const svR=r=>{setRR(r);LS.set('wc26r',r)}
  const svAll=(p,m,r)=>{setPP(p);setMM(m);setRR(r);LS.set('wc26p',p);LS.set('wc26m',m);LS.set('wc26r',r)}
  const board=buildBoard(pp,mm,rr)
  const simBoard=simResult||board.map(p=>({...p,canWin:true}))
  const dayMatches=dayFilter?mm.filter(m=>getMatchDate(m.id)===dayFilter):mm.filter(m=>m.s1!==null).slice(-4)
  const dayLabel=dayFilter?fmtDate(dayFilter):'Últimos resultados'

  const doImport=()=>{
    setImportLog(null)
    const line=importTxt.trim().split('\n').map(l=>l.trim()).find(l=>l.startsWith('PRODE26|'))
    if(!line){setImportLog({ok:false,msg:'Código no reconocido.'});return}
    const parts=line.split('|')
    if(parts.length<3){setImportLog({ok:false,msg:'Formato incorrecto.'});return}
    const pName=parts[1].trim()
    const scores=parts[2].split(',')
    if(scores.length!==MATCHES.length){setImportLog({ok:false,msg:`Se esperaban ${MATCHES.length}, llegaron ${scores.length}.`});return}
    let player=pp.find(p=>p.name.toLowerCase()===pName.toLowerCase())
    let newPP=pp
    if(!player){
      if(pp.length>=50){setImportLog({ok:false,msg:'Límite de 50.'});return}
      player={id:`p${Date.now()}`,name:pName};newPP=[...pp,player]
    }
    const newPreds={...(rr[player.id]||{})}
    let loaded=0,skipped=0
    MATCHES.forEach((m,i)=>{
      const sc=scores[i];if(!sc||sc==='?'||sc===''){skipped++;return}
      const [s1s,s2s]=sc.split('-');const s1=parseInt(s1s),s2=parseInt(s2s)
      if(isNaN(s1)||isNaN(s2)){skipped++;return}
      newPreds[m.id]={s1:Math.max(0,Math.min(20,s1)),s2:Math.max(0,Math.min(20,s2))};loaded++
    })
    svAll(newPP,mm,{...rr,[player.id]:newPreds})
    setImportTxt('');setSimResult(null)
    setImportLog({ok:true,msg:`✅ ${pName}: ${loaded} pronósticos${skipped>0?`, ${skipped} vacíos`:''}.`})
    showToast(`✓ ${pName}`)
  }

  return(

                    </div>
                  ))}
                  <button onClick={()=>setSimResult(null)} style={{width:'100%',marginTop:8,padding:'7px',background:'#333',border:'none',borderRadius:8,color:'#777',cursor:'pointer',fontSize:12}}>✕ Cerrar simulación</button>
                </div>
              )}
            </div>
            <button onClick={()=>exportPDF(board,true)}
              style={{padding:'14px',background:'#2a1a3a',border:'2px solid #6a0dad',borderRadius:10,color:'white',fontWeight:700,fontSize:14,cursor:'pointer',textAlign:'left',display:'flex',alignItems:'center',gap:10}}>
              <span style={{fontSize:24}}>📄</span>
              <div>
                <div style={{fontWeight:800}}>Exportar PDF Oficial</div>
                <div style={{fontSize:11,color:'#a64dff',marginTop:2}}>Para imprimir o guardar</div>
              </div>
            </button>
            <button onClick={()=>exportPDF(board,false)}
              style={{padding:'14px',background:'#0a1a2a',border:'2px solid #1a6b8a',borderRadius:10,color:'white',fontWeight:700,fontSize:14,cursor:'pointer',textAlign:'left',display:'flex',alignItems:'center',gap:10}}>
              <span style={{fontSize:24}}>📄</span>
              <div>
                <div style={{fontWeight:800}}>Exportar PDF No Oficial</div>
                <div style={{fontSize:11,color:'#2eafd4',marginTop:2}}>Para imprimir o guardar</div>
              </div>
            </button>
          </div>
        </div>
      )}

      {/* ══ IMPORTAR ══ */}
      {tab==='import'&&(
        <div style={{padding:'10px 10px 0'}}>
          <div style={{background:'#ffffff',borderRadius:10,padding:12,marginBottom:10,border:'1px solid #e0e4ea'}}>
            <div style={{fontSize:15,fontWeight:700,color:'#f0c030',marginBottom:4}}>📥 Importar pronósticos</div>
            <div style={{fontSize:12,color:'#888'}}>Pegá el código que te mandó el jugador</div>
          </div>
          <textarea value={importTxt} onChange={e=>setImportTxt(e.target.value)} placeholder={'Pegá aquí el código...\n\nPRODE26|Nombre|2-1,0-0,...'}
            style={{width:'100%',height:130,padding:'12px',background:'#e8f0fe',border:'1px solid #e0e4ea',borderRadius:10,color:'white',fontSize:13,fontFamily:'monospace',outline:'none',resize:'vertical',marginBottom:8}}/>
          <button onClick={doImport} style={{width:'100%',padding:'12px',background:importTxt.trim()?'#f0c030':'#333',border:'none',borderRadius:10,color:'#1a1a2e',fontWeight:800,fontSize:15,cursor:importTxt.trim()?'pointer':'not-allowed',marginBottom:10}}>📥 Importar</button>
          {importLog&&<div style={{background:importLog.ok?'rgba(39,174,96,0.15)':'rgba(231,76,60,0.15)',border:`1px solid ${importLog.ok?'#27ae60':'#e74c3c'}`,borderRadius:10,padding:'10px',fontSize:12,color:importLog.ok?'#2ecc71':'#e74c3c'}}>{importLog.msg}</div>}
        </div>
      )}

      {/* ══ JUGADORES ══ */}
      {tab==='jugadores'&&(
        <div style={{padding:'10px 10px 0'}}>
          <div style={{background:'white',borderRadius:10,padding:12,marginBottom:10,border:'1px solid #e0e4ea'}}>
            <div style={{fontSize:15,fontWeight:700,color:'#6a0dad',marginBottom:8}}>👥 Jugadores ({pp.length}/50)</div>
            <div style={{display:'flex',gap:6}}>
              <input value={newN} onChange={e=>setNewN(e.target.value)}
                onKeyDown={e=>{if(e.key==='Enter'&&newN.trim()&&pp.length<50){svP([...pp,{id:`p${Date.now()}`,name:newN.trim()}]);setNewN('');showToast('✓ Agregado')}}}
                placeholder="Nombre" style={{flex:1,padding:'8px 10px',borderRadius:8,border:'1px solid #e0e4ea',background:'#f4f5f7',color:'#1a1a2e',fontSize:14,outline:'none'}}/>
              <button onClick={()=>{if(!newN.trim()||pp.length>=50)return;svP([...pp,{id:`p${Date.now()}`,name:newN.trim()}]);setNewN('');showToast('✓ Agregado')}}
                style={{padding:'8px 14px',background:pp.length>=50||!newN.trim()?'#ccc':'#6a0dad',color:'white',borderRadius:8,fontWeight:700,border:'none',cursor:'pointer',fontSize:15}}>+</button>
            </div>
            <div style={{fontSize:11,color:'#aaa',marginTop:8}}>▲▼ para reordenar · tocá el nombre para editar</div>
          </div>
          {pp.map((p,i)=>{
            const done=Object.values(rr[p.id]||{}).filter(x=>x&&x.s1!==null&&x.s2!==null).length
            const isEditing=editingId===p.id
            const moveUp=()=>{if(i===0)return;const r=[...pp];[r[i-1],r[i]]=[r[i],r[i-1]];svP(r)}
            const moveDown=()=>{if(i===pp.length-1)return;const r=[...pp];[r[i],r[i+1]]=[r[i+1],r[i]];svP(r)}
            return(
              <div key={p.id} style={{background:'white',borderRadius:8,padding:'9px 12px',marginBottom:5,border:'1px solid #e0e4ea'}}>
                <div style={{display:'flex',alignItems:'center',gap:6}}>
                  <div style={{display:'flex',flexDirection:'column',gap:0,flexShrink:0}}>
                    <button onClick={moveUp} style={{background:'transparent',border:'none',color:i===0?'#ddd':'#6a0dad',cursor:i===0?'default':'pointer',fontSize:13,lineHeight:1,padding:'1px 4px',fontWeight:900}}>▲</button>
                    <button onClick={moveDown} style={{background:'transparent',border:'none',color:i===pp.length-1?'#ddd':'#6a0dad',cursor:i===pp.length-1?'default':'pointer',fontSize:13,lineHeight:1,padding:'1px 4px',fontWeight:900}}>▼</button>
                  </div>
                  <div style={{width:22,height:22,borderRadius:'50%',background:'#ede9f7',display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,color:'#6a0dad',fontWeight:700,flexShrink:0}}>{i+1}</div>
                  {isEditing?(
                    <input autoFocus value={editingName} onChange={e=>setEditingName(e.target.value)}
                      onBlur={()=>{if(editingName.trim())svP(pp.map(x=>x.id===p.id?{...x,name:editingName.trim()}:x));setEditingId(null)}}
                      onKeyDown={e=>{if(e.key==='Enter'){if(editingName.trim())svP(pp.map(x=>x.id===p.id?{...x,name:editingName.trim()}:x));setEditingId(null)}if(e.key==='Escape')setEditingId(null)}}
                      style={{flex:1,fontSize:14,color:'#1a1a2e',border:'2px solid #6a0dad',borderRadius:6,padding:'4px 8px',outline:'none'}}/>
                  ):(
                    <span onClick={()=>{setEditingId(p.id);setEditingName(p.name)}} style={{flex:1,fontSize:14,color:'#1a1a2e',cursor:'pointer'}}>
                      {p.name} <span style={{fontSize:10,color:'#bbb'}}>✏️</span>
                    </span>
                  )}
                  <span style={{fontSize:10,color:done===72?'#27ae60':done>0?'#6a0dad':'#ccc',flexShrink:0}}>{done}/72</span>
                  <button onClick={()=>{const r2={...rr};delete r2[p.id];svAll(pp.filter(x=>x.id!==p.id),mm,r2);setSimResult(null);showToast('Eliminado','#e74c3c')}}
                    style={{background:'transparent',border:'none',color:'#e74c3c',cursor:'pointer',fontSize:20,lineHeight:1,padding:'0 2px',flexShrink:0}}>×</button>
                </div>
                <div style={{marginTop:5,background:'#f0f2f5',borderRadius:3,height:3,marginLeft:62}}>
                  <div style={{background:done===72?'#27ae60':'#6a0dad',width:`${(done/72)*100}%`,height:'100%',borderRadius:3}}/>
                </div>
              </div>
            )
          })}
        </div>
      )}

      {/* ══ PRONÓS ══ */}
      {tab==='pronos'&&!selP&&(
        <div style={{padding:'10px 10px 0'}}>
          <div style={{background:'#ffffff',borderRadius:10,padding:12,marginBottom:10,border:'1px solid #e0e4ea'}}>
            <div style={{fontSize:15,fontWeight:700,color:'#f0c030'}}>📝 Pronósticos por jugador</div>
          </div>
          {pp.map(p=>{
            const done=Object.values(rr[p.id]||{}).filter(x=>x&&x.s1!==null&&x.s2!==null).length
            return(
              <div key={p.id} onClick={()=>{setSelP(p);setPGrp('ALL')}} style={{background:'#ffffff',borderRadius:10,padding:'10px 14px',marginBottom:5,display:'flex',alignItems:'center',gap:10,cursor:'pointer',border:'1px solid #e0e4ea'}}>
                <div style={{flex:1}}>
                  <div style={{fontWeight:600,fontSize:14,color:'#1a1a2e'}}>{p.name}</div>
                  <div style={{marginTop:5,background:'#e8f0fe',borderRadius:4,height:3}}>
                    <div style={{background:done===72?'#2ecc71':'#f0c030',width:`${(done/72)*100}%`,height:'100%',borderRadius:4}}/>
                  </div>
                  <div style={{fontSize:10,color:done===72?'#2ecc71':'#888',marginTop:3}}>{done}/72</div>
                </div>
                <span style={{color:'#4a9eff',fontSize:18}}>›</span>
              </div>
            )
          })}
        </div>
      )}
      {tab==='pronos'&&selP&&(
        <div style={{padding:'10px 10px 0'}}>
          <div style={{background:'#ffffff',borderRadius:10,padding:'9px 12px',marginBottom:8,display:'flex',alignItems:'center',gap:8,border:'1px solid #e0e4ea'}}>
            <button onClick={()=>setSelP(null)} style={{background:'transparent',border:'none',color:'#4a9eff',cursor:'pointer',fontSize:22,lineHeight:1,padding:0}}>←</button>
            <div style={{fontWeight:700,color:'#f0c030',fontSize:14,flex:1}}>{selP.name}</div>
          </div>
          <div style={{display:'flex',gap:4,overflowX:'auto',paddingBottom:6,marginBottom:8}}>
            {['ALL',...grps].map(g=><button key={g} onClick={()=>setPGrp(g)} style={pill(pGrp===g)}>{g==='ALL'?'Todos':'G'+g}</button>)}
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:5}}>
            {(pGrp==='ALL'?mm:mm.filter(m=>m.g===pGrp)).map(m=>{
              const pred=(rr[selP.id]||{})[m.id];const p2=calcPts(pred,m)
              const has=pred&&pred.s1!==null&&pred.s2!==null
              const bc=p2===3?'#27ae60':p2===1?'#f39c12':(p2===0&&m.s1!==null&&has)?'#e74c3c':'#2a2a3a'
              const bg=p2===3?'rgba(39,174,96,0.08)':p2===1?'rgba(243,156,18,0.08)':(p2===0&&m.s1!==null&&has)?'rgba(231,76,60,0.06)':'#16213e'
              return(
                <div key={m.id} style={{background:bg,border:`1px solid ${bc}`,borderRadius:10,padding:'8px 10px'}}>
                  <div style={{display:'flex',alignItems:'center',marginBottom:5}}>
                    <span style={{fontSize:9,color:'#6a0dad',background:'#ede9f7',padding:'1px 5px',borderRadius:4,fontWeight:700}}>G{m.g}</span>
                    {p2===3&&<span style={{fontSize:10,color:'#2ecc71',marginLeft:6}}>⚡+3</span>}
                    {p2===1&&<span style={{fontSize:10,color:'#f0c030',marginLeft:6}}>📈+1</span>}
                    {p2===0&&m.s1!==null&&has&&<span style={{fontSize:10,color:'#e74c3c',marginLeft:6}}>✗</span>}
                    {m.s1!==null&&<span style={{fontSize:10,color:'#999',marginLeft:'auto'}}>Real:{m.s1}-{m.s2}</span>}
                  </div>
                  <div style={{display:'flex',alignItems:'center',gap:6}}>
                    <span style={{flex:1,textAlign:'right',fontSize:12,color:'#222',fontWeight:500}}>{m.t1}</span>
                    <input type="number" value={pred?.s1??''} min="0" max="20" onChange={e=>svR({...rr,[selP.id]:{...(rr[selP.id]||{}),[m.id]:{...(rr[selP.id]?.[m.id]||{}),s1:toNum(e.target.value)}}})} style={si}/>
                    <span style={{color:'#aaa',fontWeight:700}}>-</span>
                    <input type="number" value={pred?.s2??''} min="0" max="20" onChange={e=>svR({...rr,[selP.id]:{...(rr[selP.id]||{}),[m.id]:{...(rr[selP.id]?.[m.id]||{}),s2:toNum(e.target.value)}}})} style={si}/>
                    <span style={{flex:1,fontSize:12,color:'#222',fontWeight:500}}>{m.t2}</span>
                  </div>
                </div>
              )
            })}
          </div>
        </div>
      )}

      {/* ══ RESULTADOS ══ */}
      {tab==='resultados'&&(
        <div style={{padding:'10px 10px 0'}}>
          <div style={{background:'#ffffff',borderRadius:10,padding:12,marginBottom:10,border:'1px solid #e0e4ea'}}>
            <div style={{fontSize:15,fontWeight:700,color:'#f0c030',marginBottom:8}}>⚙️ Resultados Reales</div>
            <div style={{display:'flex',gap:4,overflowX:'auto',paddingBottom:2}}>
              {grps.map(g=>{const done=mm.filter(m=>m.g===g&&m.s1!==null).length;return<button key={g} onClick={()=>setAGrp(g)} style={pill(aGrp===g)}>G{g} {done}/6</button>})}
            </div>
          </div>
          {mm.filter(m=>m.g===aGrp).map((m,idx)=>{
            const mDate=getMatchDate(m.id)
            const jornada=idx<2?1:idx<4?2:3
            return(
              <div key={m.id} style={{background:m.s1!==null?'rgba(39,174,96,0.06)':'#ffffff',border:`1px solid ${m.s1!==null?'#27ae60':'#2a2a3a'}`,borderRadius:10,padding:'9px 10px',marginBottom:5}}>
                <div style={{display:'flex',alignItems:'center',marginBottom:5,gap:8}}>
                  <span style={{fontSize:9,background:'#ede9f7',color:'#6a0dad',padding:'2px 6px',borderRadius:4,fontWeight:700}}>Jornada {jornada}</span>
                  <span style={{fontSize:10,color:'#888'}}>📅 {mDate?fmtDate(mDate):''}{getMatchTime(m.id)?' · ⏰ '+getMatchTime(m.id)+'hs':''}</span>
                  {m.s1!==null&&<span style={{fontSize:10,color:'#2ecc71',marginLeft:'auto'}}>✓ {m.s1}-{m.s2}</span>}
                  {m.s1!==null&&<button onClick={()=>{svM(mm.map(x=>x.id===m.id?{...x,s1:null,s2:null}:x));setSimResult(null);showToast('Borrado','#e74c3c')}} style={{background:'transparent',border:'none',color:'#e74c3c',cursor:'pointer',fontSize:11,padding:0}}>✕</button>}
                </div>
                <div style={{display:'flex',alignItems:'center',gap:6}}>
                  <span style={{flex:1,textAlign:'right',fontSize:12,color:'#222',fontWeight:500}}>{m.t1}</span>
                  <input type="number" value={m.s1??''} min="0" max="20"
                    onChange={e=>{const v=toNum(e.target.value);svM(mm.map(x=>x.id===m.id?{...x,s1:v}:x));setSimResult(null)}}
                    onBlur={()=>{if(m.s1!==null&&m.s2!==null)showToast('✓ Guardado')}} style={si}/>
                  <span style={{color:'#aaa',fontWeight:700}}>-</span>
                  <input type="number" value={m.s2??''} min="0" max="20"
                    onChange={e=>{const v=toNum(e.target.value);svM(mm.map(x=>x.id===m.id?{...x,s2:v}:x));setSimResult(null)}}
                    onBlur={()=>{if(m.s1!==null&&m.s2!==null)showToast('✓ Guardado')}} style={si}/>
                  <span style={{flex:1,fontSize:12,color:'#222',fontWeight:500}}>{m.t2}</span>
                </div>
              </div>
            )
          })}
        </div>
      )}

      {/* Tab bar */}
      <div style={{position:'fixed',bottom:0,left:'50%',transform:'translateX(-50%)',width:'100%',maxWidth:430,background:'#ffffff',borderTop:'1px solid #dde3ec',display:'flex',zIndex:100}}>
        {[['tabla','🏆','Tabla'],['dia','📅','Día'],['datos','📊','Datos'],['import','📥','Import'],['jugadores','👥','Jugadores'],['pronos','📝','Pronos'],['resultados','⚙️','Result.']].map(([id,ic,la])=>(
          <button key={id} onClick={()=>{setTab(id);if(id!=='pronos')setSelP(null)}}
            style={{flex:1,padding:'7px 1px 5px',background:'transparent',border:'none',cursor:'pointer',color:tab===id?'#6a0dad':'#aaa',display:'flex',flexDirection:'column',alignItems:'center',gap:1,fontSize:7,fontWeight:tab===id?700:400}}>
            <span style={{fontSize:16}}>{ic}</span>{la}
          </button>
        ))}
      </div>
    </div>
  )
}

function App(){
  const [hash,setHash]=useState(window.location.hash)
  useEffect(()=>{const h=()=>setHash(window.location.hash);window.addEventListener('hashchange',h);return()=>window.removeEventListener('hashchange',h)},[])
  return hash==='#admin'?<Admin/>:<Jugador/>
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>)
</script></body></html>
